name: Update visual assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/logos/svg/**"
      - "assets/backgrounds/svg/**"
      - "assets/profile/header.svg"
      - "scripts/update_visual_assets.py"
      - ".github/workflows/update_visual_assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install visual asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes inkscape
          python -m pip install --disable-pip-version-check pillow

      - name: Update visual assets
        env:
          FORCE_PNG_EXPORT: "1"
        run: python scripts/update_visual_assets.py

      - name: Commit visual asset changes
        run: |
          git add assets/logos/svg/hittite_sun_disk_golden_crescent-reversed.svg
          git add assets/backgrounds/svg/eagle_background.svg
          git add assets/profile/header.svg
          git add assets/logos/png
          git add assets/backgrounds/png

          if git diff --cached --quiet; then
            echo "No visual asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update visual assets"
          git push
name: Update profile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_profile.py"
      - ".github/workflows/update_profile.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update profile data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit profile changes
        run: |
          git add README.md assets/profile/stats.svg assets/profile/languages.svg

          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update profile data"
          git push

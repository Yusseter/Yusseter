<svg xmlns="http://www.w3.org/2000/svg" width="370" height="170" viewBox="0 0 370 170" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter GitHub Stats</title>
    <desc id="desc">Aggregated GitHub statistics for Yusseter.</desc>

    <style>
        .card {
            fill: #ffffff;
            stroke: #d0d7de;
        }

        .title {
            fill: #491d34;
            font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .value {
            fill: #1f2328;
            font: 600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .label {
            fill: #656d76;
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .rule {
            stroke: #d0d7de;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                fill: #0d1117;
                stroke: #30363d;
            }

            .title {
                fill: #c8ad67;
            }

            .value {
                fill: #e6edf3;
            }

            .label {
                fill: #8b949e;
            }

            .rule {
                stroke: #30363d;
            }
        }
    </style>

    <rect class="card" x="0.5" y="0.5" width="369" height="169" rx="8" />

    <text class="title" x="20" y="31">GitHub overview</text>

    <line class="rule" x1="20" y1="47" x2="350" y2="47" />
    <line class="rule" x1="185" y1="66" x2="185" y2="141" />

    
    <g transform="translate(95 101)">
        <text class="value" x="0" y="0" text-anchor="middle">3</text>
        <text class="label" x="0" y="25" text-anchor="middle">Total stars</text>
    </g>
    <g transform="translate(275 101)">
        <text class="value" x="0" y="0" text-anchor="middle">7</text>
        <text class="label" x="0" y="25" text-anchor="middle">Total releases</text>
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="370" height="190" viewBox="0 0 370 190" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter GitHub Stats</title>
    <desc id="desc">Aggregated GitHub statistics for Yusseter.</desc>

    <style>
        .card {
            fill: transparent;
            stroke: #d1d9e0b3;
        }

        .title {
            fill: #491d34;
            font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .value {
            fill: #1f2328;
            font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .label {
            fill: #59636e;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .rule {
            stroke: #d1d9e0b3;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                fill: transparent;
                stroke: #3d444db3;
            }

            .title {
                fill: #c8ad67;
            }

            .value {
                fill: #f0f6fc;
            }

            .label {
                fill: #9198a1;
            }

            .rule {
                stroke: #3d444db3;
            }
        }
    </style>

    <rect class="card" x="0.5" y="0.5" width="369" height="189" rx="6" />

    <text class="title" x="20" y="32">GitHub overview</text>

    <line class="rule" x1="20" y1="51" x2="350" y2="51" />
    <line class="rule" x1="185" y1="72" x2="185" y2="160" />

    
    <g transform="translate(95 115)">
        <text class="value" x="0" y="0" text-anchor="middle">3</text>
        <text class="label" x="0" y="30" text-anchor="middle">Total stars</text>
    </g>
    <g transform="translate(275 115)">
        <text class="value" x="0" y="0" text-anchor="middle">7</text>
        <text class="label" x="0" y="30" text-anchor="middle">Total releases</text>
    </g>
</svg>

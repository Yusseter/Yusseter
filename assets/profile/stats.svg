<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter GitHub Stats</title>
    <desc id="desc">Live GitHub statistics for Yusseter.</desc>

    <style>
        .card {
            fill: #ffffff;
            stroke: #d0d7de;
        }

        .title {
            fill: #491d34;
            font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .value {
            fill: #1f2328;
            font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .label {
            fill: #656d76;
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .rule {
            stroke: #d0d7de;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                fill: #0d1117;
                stroke: #30363d;
            }

            .title {
                fill: #c8ad67;
            }

            .value {
                fill: #e6edf3;
            }

            .label {
                fill: #8b949e;
            }

            .rule {
                stroke: #30363d;
            }
        }
    </style>

    <rect class="card" x="0.5" y="0.5" width="559" height="179" rx="8" />

    <text class="title" x="24" y="35">Yusseter · GitHub overview</text>

    <line class="rule" x1="24" y1="51" x2="536" y2="51" />

    
    <g transform="translate(35 78)">
        <text class="value" x="0" y="0">3</text>
        <text class="label" x="0" y="24">Total stars</text>
    </g>
    <g transform="translate(167 78)">
        <text class="value" x="0" y="0">9</text>
        <text class="label" x="0" y="24">Public repos</text>
    </g>
    <g transform="translate(299 78)">
        <text class="value" x="0" y="0">578</text>
        <text class="label" x="0" y="24">Contributions</text>
    </g>
    <g transform="translate(431 78)">
        <text class="value" x="0" y="0">1</text>
        <text class="label" x="0" y="24">Followers</text>
    </g>
</svg>

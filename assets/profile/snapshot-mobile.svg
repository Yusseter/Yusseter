<svg xmlns="http://www.w3.org/2000/svg" width="370" height="400" viewBox="0 0 370 400" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter GitHub Snapshot</title>
    <desc id="desc">GitHub statistics and language distribution for Yusseter.</desc>

    <style>
        .card {
            fill: transparent;
            stroke: #d1d9e0b3;
        }

        .title {
            fill: #1f2328;
            font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .value {
            fill: #1f2328;
            font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .primary {
            fill: #1f2328;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .secondary {
            fill: #59636e;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .rule {
            stroke: #d1d9e0b3;
        }

        .bar-background {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                stroke: #3d444db3;
            }

            .title,
            .value,
            .primary {
                fill: #f0f6fc;
            }

            .secondary {
                fill: #9198a1;
            }

            .rule {
                stroke: #3d444db3;
            }

            .bar-background {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="language-bar-clip">
            <rect x="20" y="268" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <!-- GitHub overview -->
    <rect class="card" x="0.5" y="0.5" width="369" height="189" rx="6" />

    <text class="title" x="20" y="32">GitHub overview</text>

    <line class="rule" x1="20" y1="51" x2="350" y2="51" />
    <line class="rule" x1="185" y1="72" x2="185" y2="160" />

    
    <g transform="translate(95 115)">
        <text class="value" x="0" y="0" text-anchor="middle">3</text>
        <text class="secondary" x="0" y="30" text-anchor="middle">Total stars</text>
    </g>
    <g transform="translate(275 115)">
        <text class="value" x="0" y="0" text-anchor="middle">8</text>
        <text class="secondary" x="0" y="30" text-anchor="middle">Total releases</text>
    </g>

    <!-- Languages -->
    <rect class="card" x="0.5" y="210.5" width="369" height="189" rx="6" />

    <text class="title" x="20" y="242">Languages</text>

    <rect class="bar-background" x="20" y="268" width="330" height="10" rx="5" />

    <g clip-path="url(#language-bar-clip)">
        <rect x="20.00" y="268" width="170.33" height="10" fill="#012456" />
    <rect x="190.33" y="268" width="81.30" height="10" fill="#f34b7d" />
    <rect x="271.63" y="268" width="35.90" height="10" fill="#f1e05a" />
    <rect x="307.53" y="268" width="17.38" height="10" fill="#663399" />
    <rect x="324.91" y="268" width="14.22" height="10" fill="#3572A5" />
    </g>

    
    <circle cx="26" cy="294" r="4" fill="#012456" />
    <text class="primary" x="38" y="298">PowerShell</text>
    <text class="secondary" x="350" y="298" text-anchor="end">51.6%</text>
    <circle cx="26" cy="316" r="4" fill="#f34b7d" />
    <text class="primary" x="38" y="320">C++</text>
    <text class="secondary" x="350" y="320" text-anchor="end">24.6%</text>
    <circle cx="26" cy="338" r="4" fill="#f1e05a" />
    <text class="primary" x="38" y="342">JavaScript</text>
    <text class="secondary" x="350" y="342" text-anchor="end">10.9%</text>
    <circle cx="26" cy="360" r="4" fill="#663399" />
    <text class="primary" x="38" y="364">CSS</text>
    <text class="secondary" x="350" y="364" text-anchor="end">5.3%</text>
    <circle cx="26" cy="382" r="4" fill="#3572A5" />
    <text class="primary" x="38" y="386">Python</text>
    <text class="secondary" x="350" y="386" text-anchor="end">4.3%</text>
</svg>

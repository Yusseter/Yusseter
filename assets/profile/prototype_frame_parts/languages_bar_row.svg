<svg xmlns="http://www.w3.org/2000/svg"
 width="370" height="28"
 viewBox="0 0 370 28"
 role="presentation" aria-hidden="true">
<style>
.edge {
    fill: #d1d9e0;
    fill-opacity: 0.70;
}
.stroke {
    fill: none;
    stroke: #d1d9e0;
    stroke-opacity: 0.70;
    stroke-width: 1;
}
.track {
    fill: #59636e;
    fill-opacity: 0.12;
}

@media (prefers-color-scheme: dark) {
    .edge {
        fill: #3d444d;
        fill-opacity: 0.70;
    }
    .stroke {
        stroke: #3d444d;
        stroke-opacity: 0.70;
    }
    .track {
        fill: #9198a1;
        fill-opacity: 0.18;
    }
}
</style>
<defs>
  <clipPath id="bar-clip">
    <rect x="20" y="9" width="330" height="10" rx="5"/>
  </clipPath>
</defs>

<rect class="edge" x="0" y="0" width="1" height="28"/>
<rect class="edge" x="369" y="0" width="1" height="28"/>

<rect class="track" x="20" y="9" width="330" height="10" rx="5"/>

<g clip-path="url(#bar-clip)">
  <rect x="20.00" y="9" width="152.46" height="10" fill="#f34b7d"/>
<rect x="172.46" y="9" width="65.34" height="10" fill="#f1e05a"/>
<rect x="237.80" y="9" width="34.98" height="10" fill="#012456"/>
<rect x="272.78" y="9" width="31.68" height="10" fill="#663399"/>
<rect x="304.46" y="9" width="25.74" height="10" fill="#3572a5"/>
</g>
</svg>

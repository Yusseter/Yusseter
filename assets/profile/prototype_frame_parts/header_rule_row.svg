<svg xmlns="http://www.w3.org/2000/svg"
 width="370" height="20"
 viewBox="0 0 370 20"
 role="presentation" aria-hidden="true">
<style>
.edge {
    fill: #d1d9e0;
    fill-opacity: 0.70;
}
.stroke {
    fill: none;
    stroke: #d1d9e0;
    stroke-opacity: 0.70;
    stroke-width: 1;
}
.track {
    fill: #59636e;
    fill-opacity: 0.12;
}

@media (prefers-color-scheme: dark) {
    .edge {
        fill: #3d444d;
        fill-opacity: 0.70;
    }
    .stroke {
        stroke: #3d444d;
        stroke-opacity: 0.70;
    }
    .track {
        fill: #9198a1;
        fill-opacity: 0.18;
    }
}
</style>
<rect class="edge" x="0" y="0" width="1" height="20"/>
<rect class="edge" x="369" y="0" width="1" height="20"/>
<line class="stroke" x1="20" y1="10.5" x2="350" y2="10.5"/>
</svg>

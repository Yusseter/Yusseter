<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter GitHub Snapshot</title>
    <desc id="desc">GitHub statistics and language distribution for Yusseter.</desc>

    <style>
        .card {
            fill: transparent;
            stroke: #d1d9e0b3;
        }

        .title {
            fill: #1f2328;
            font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .value {
            fill: #1f2328;
            font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .primary {
            fill: #1f2328;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .secondary {
            fill: #59636e;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .rule {
            stroke: #d1d9e0b3;
        }

        .bar-background {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                stroke: #3d444db3;
            }

            .title,
            .value,
            .primary {
                fill: #f0f6fc;
            }

            .secondary {
                fill: #9198a1;
            }

            .rule {
                stroke: #3d444db3;
            }

            .bar-background {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="language-bar-clip">
            <rect x="410" y="58" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <!-- GitHub overview -->
    <rect class="card" x="0.5" y="0.5" width="369" height="189" rx="6" />

    <text class="title" x="20" y="32">GitHub overview</text>

    <line class="rule" x1="20" y1="51" x2="350" y2="51" />
    <line class="rule" x1="185" y1="72" x2="185" y2="160" />

    
    <g transform="translate(95 115)">
        <text class="value" x="0" y="0" text-anchor="middle">3</text>
        <text class="secondary" x="0" y="30" text-anchor="middle">Total stars</text>
    </g>
    <g transform="translate(275 115)">
        <text class="value" x="0" y="0" text-anchor="middle">7</text>
        <text class="secondary" x="0" y="30" text-anchor="middle">Total releases</text>
    </g>

    <!-- Languages -->
    <rect class="card" x="390.5" y="0.5" width="369" height="189" rx="6" />

    <text class="title" x="410" y="32">Languages</text>

    <rect class="bar-background" x="410" y="58" width="330" height="10" rx="5" />

    <g clip-path="url(#language-bar-clip)">
        <rect x="410.00" y="58" width="145.39" height="10" fill="#012456" />
    <rect x="555.39" y="58" width="87.31" height="10" fill="#f34b7d" />
    <rect x="642.70" y="58" width="44.57" height="10" fill="#f1e05a" />
    <rect x="687.27" y="58" width="21.58" height="10" fill="#663399" />
    <rect x="708.85" y="58" width="17.66" height="10" fill="#3572A5" />
    </g>

    
    <circle cx="416" cy="84" r="4" fill="#012456" />
    <text class="primary" x="428" y="88">PowerShell</text>
    <text class="secondary" x="740" y="88" text-anchor="end">44.1%</text>
    <circle cx="416" cy="106" r="4" fill="#f34b7d" />
    <text class="primary" x="428" y="110">C++</text>
    <text class="secondary" x="740" y="110" text-anchor="end">26.5%</text>
    <circle cx="416" cy="128" r="4" fill="#f1e05a" />
    <text class="primary" x="428" y="132">JavaScript</text>
    <text class="secondary" x="740" y="132" text-anchor="end">13.5%</text>
    <circle cx="416" cy="150" r="4" fill="#663399" />
    <text class="primary" x="428" y="154">CSS</text>
    <text class="secondary" x="740" y="154" text-anchor="end">6.5%</text>
    <circle cx="416" cy="172" r="4" fill="#3572A5" />
    <text class="primary" x="428" y="176">Python</text>
    <text class="secondary" x="740" y="176" text-anchor="end">5.4%</text>
</svg>

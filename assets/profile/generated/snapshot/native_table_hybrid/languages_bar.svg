<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="104.88" height="10" fill="#012456" />
        <rect x="104.88" y="0" width="44.53" height="10" fill="#b07219" />
        <rect x="149.41" y="0" width="40.48" height="10" fill="#7355dd" />
        <rect x="189.89" y="0" width="39.04" height="10" fill="#3572a5" />
        <rect x="228.93" y="0" width="22.77" height="10" fill="#f34b7d" />
    </g>
</svg>

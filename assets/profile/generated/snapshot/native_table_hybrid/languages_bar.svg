<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="96.05" height="10" fill="#7355dd" />
        <rect x="96.05" y="0" width="62.81" height="10" fill="#012456" />
        <rect x="158.86" y="0" width="41.35" height="10" fill="#b07219" />
        <rect x="200.21" y="0" width="32.45" height="10" fill="#3572a5" />
        <rect x="232.67" y="0" width="23.30" height="10" fill="#f1e05a" />
    </g>
</svg>

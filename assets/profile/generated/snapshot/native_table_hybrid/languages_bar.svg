<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="88.25" height="10" fill="#7355dd" />
        <rect x="88.25" y="0" width="58.33" height="10" fill="#012456" />
        <rect x="146.59" y="0" width="54.90" height="10" fill="#3572a5" />
        <rect x="201.49" y="0" width="37.99" height="10" fill="#b07219" />
        <rect x="239.48" y="0" width="22.50" height="10" fill="#f1e05a" />
    </g>
</svg>

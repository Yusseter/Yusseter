<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="117.76" height="10" fill="#012456" />
        <rect x="117.76" y="0" width="51.44" height="10" fill="#b07219" />
        <rect x="169.20" y="0" width="43.36" height="10" fill="#3572a5" />
        <rect x="212.56" y="0" width="26.30" height="10" fill="#f34b7d" />
        <rect x="238.86" y="0" width="25.17" height="10" fill="#5686a5" />
    </g>
</svg>

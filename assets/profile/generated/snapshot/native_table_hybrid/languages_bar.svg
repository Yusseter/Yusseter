<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="119.39" height="10" fill="#012456" />
        <rect x="119.39" y="0" width="52.15" height="10" fill="#b07219" />
        <rect x="171.54" y="0" width="43.96" height="10" fill="#3572a5" />
        <rect x="215.50" y="0" width="26.67" height="10" fill="#f34b7d" />
        <rect x="242.17" y="0" width="25.01" height="10" fill="#f1e05a" />
    </g>
</svg>

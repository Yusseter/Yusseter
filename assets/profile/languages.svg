<svg xmlns="http://www.w3.org/2000/svg" width="370" height="170" viewBox="0 0 370 170" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter Top Languages</title>
    <desc id="desc">Language distribution across public non-archived project repositories owned by Yusseter.</desc>

    <style>
        .card {
            fill: #ffffff;
            stroke: #d0d7de;
        }

        .title {
            fill: #491d34;
            font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .language {
            fill: #1f2328;
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .percentage,
        .muted {
            fill: #656d76;
            font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        .bar-background {
            fill: #eaeef2;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                fill: #0d1117;
                stroke: #30363d;
            }

            .title {
                fill: #c8ad67;
            }

            .language {
                fill: #e6edf3;
            }

            .percentage,
            .muted {
                fill: #8b949e;
            }

            .bar-background {
                fill: #21262d;
            }
        }
    </style>

    <defs>
        <clipPath id="language-bar-clip">
            <rect x="20" y="52" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="card" x="0.5" y="0.5" width="369" height="169" rx="8" />

    <text class="title" x="20" y="31">Languages</text>

    <rect class="bar-background" x="20" y="52" width="330" height="10" rx="5" />

    <g clip-path="url(#language-bar-clip)">
        <rect x="20.00" y="52" width="154.72" height="10" fill="#f34b7d" />
    <rect x="174.72" y="52" width="64.47" height="10" fill="#f1e05a" />
    <rect x="239.20" y="52" width="34.52" height="10" fill="#012456" />
    <rect x="273.72" y="52" width="31.21" height="10" fill="#663399" />
    <rect x="304.93" y="52" width="25.54" height="10" fill="#3572A5" />
    </g>

    
    <circle cx="26" cy="80" r="4" fill="#f34b7d" />
    <text class="language" x="38" y="84">C++</text>
    <text class="percentage" x="350" y="84" text-anchor="end">46.9%</text>
    <circle cx="26" cy="98" r="4" fill="#f1e05a" />
    <text class="language" x="38" y="102">JavaScript</text>
    <text class="percentage" x="350" y="102" text-anchor="end">19.5%</text>
    <circle cx="26" cy="116" r="4" fill="#012456" />
    <text class="language" x="38" y="120">PowerShell</text>
    <text class="percentage" x="350" y="120" text-anchor="end">10.5%</text>
    <circle cx="26" cy="134" r="4" fill="#663399" />
    <text class="language" x="38" y="138">CSS</text>
    <text class="percentage" x="350" y="138" text-anchor="end">9.5%</text>
    <circle cx="26" cy="152" r="4" fill="#3572A5" />
    <text class="language" x="38" y="156">Python</text>
    <text class="percentage" x="350" y="156" text-anchor="end">7.7%</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="370" height="190" viewBox="0 0 370 190" role="img" aria-labelledby="title desc">
    <title id="title">Yusseter Top Languages</title>
    <desc id="desc">Language distribution across public non-archived project repositories owned by Yusseter.</desc>

    <style>
        .card {
            fill: transparent;
            stroke: #d1d9e0b3;
        }

        .title {
            fill: #491d34;
            font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .language {
            fill: #1f2328;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .percentage,
        .muted {
            fill: #59636e;
            font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        .bar-background {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .card {
                fill: transparent;
                stroke: #3d444db3;
            }

            .title {
                fill: #c8ad67;
            }

            .language {
                fill: #f0f6fc;
            }

            .percentage,
            .muted {
                fill: #9198a1;
            }

            .bar-background {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="language-bar-clip">
            <rect x="20" y="58" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="card" x="0.5" y="0.5" width="369" height="189" rx="6" />

    <text class="title" x="20" y="32">Languages</text>

    <rect class="bar-background" x="20" y="58" width="330" height="10" rx="5" />

    <g clip-path="url(#language-bar-clip)">
        <rect x="20.00" y="58" width="154.72" height="10" fill="#f34b7d" />
    <rect x="174.72" y="58" width="64.47" height="10" fill="#f1e05a" />
    <rect x="239.20" y="58" width="34.52" height="10" fill="#012456" />
    <rect x="273.72" y="58" width="31.21" height="10" fill="#663399" />
    <rect x="304.93" y="58" width="25.54" height="10" fill="#3572A5" />
    </g>

    
    <circle cx="26" cy="84" r="4" fill="#f34b7d" />
    <text class="language" x="38" y="88">C++</text>
    <text class="percentage" x="350" y="88" text-anchor="end">46.9%</text>
    <circle cx="26" cy="106" r="4" fill="#f1e05a" />
    <text class="language" x="38" y="110">JavaScript</text>
    <text class="percentage" x="350" y="110" text-anchor="end">19.5%</text>
    <circle cx="26" cy="128" r="4" fill="#012456" />
    <text class="language" x="38" y="132">PowerShell</text>
    <text class="percentage" x="350" y="132" text-anchor="end">10.5%</text>
    <circle cx="26" cy="150" r="4" fill="#663399" />
    <text class="language" x="38" y="154">CSS</text>
    <text class="percentage" x="350" y="154" text-anchor="end">9.5%</text>
    <circle cx="26" cy="172" r="4" fill="#3572A5" />
    <text class="language" x="38" y="176">Python</text>
    <text class="percentage" x="350" y="176" text-anchor="end">7.7%</text>
</svg>

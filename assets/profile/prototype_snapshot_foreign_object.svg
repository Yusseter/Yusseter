<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="190"
     viewBox="0 0 760 190"
     role="img"
     aria-labelledby="title desc">

  <title id="title">ForeignObject GitHub Snapshot Prototype</title>
  <desc id="desc">
    GitHub snapshot prototype using SVG geometry and XHTML text.
  </desc>

  <style>
    .card {
      fill: transparent;
      stroke: #d1d9e0b3;
    }

    .rule {
      stroke: #d1d9e0b3;
    }

    .bar-background {
      fill: #59636e;
      fill-opacity: 0.12;
    }

    .html-text {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
      white-space: nowrap;
    }

    .title-text {
      font-size: 20px;
      font-weight: 600;
      line-height: 26px;
    }

    .value-text {
      font-size: 28px;
      font-weight: 600;
      line-height: 38px;
      text-align: center;
    }

    .primary {
      color: #1f2328;
    }

    .secondary {
      color: #59636e;
    }

    .body-text {
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      text-align: center;
    }

    .html-row {
      font-size: 16px;
      font-weight: 400;
      line-height: 22px;
    }

    .html-right {
      text-align: right;
    }

    @media (prefers-color-scheme: dark) {
      .card {
        stroke: #3d444db3;
      }

      .rule {
        stroke: #3d444db3;
      }

      .bar-background {
        fill: #9198a1;
        fill-opacity: 0.18;
      }

      .title-text,
      .value-text,
      .primary {
        color: #f0f6fc;
      }

      .secondary {
        color: #9198a1;
      }
    }
  </style>

  <defs>
    <clipPath id="language-bar-clip">
      <rect x="410" y="58" width="330" height="10" rx="5" />
    </clipPath>
  </defs>

  <!-- GitHub overview geometry -->
  <rect class="card"
        x="0.5" y="0.5"
        width="369" height="189"
        rx="6" />

  <line class="rule"
        x1="20" y1="51"
        x2="350" y2="51" />

  <line class="rule"
        x1="185" y1="72"
        x2="185" y2="160" />

  <!-- GitHub overview HTML text -->
  <foreignObject x="20" y="8" width="330" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text title-text">GitHub overview</div>
  </foreignObject>

  <foreignObject x="55" y="84" width="80" height="38">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text value-text">3</div>
  </foreignObject>

  <foreignObject x="35" y="124" width="120" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text secondary body-text">Total stars</div>
  </foreignObject>

  <foreignObject x="235" y="84" width="80" height="38">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text value-text">7</div>
  </foreignObject>

  <foreignObject x="205" y="124" width="140" height="26">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text secondary body-text">Total releases</div>
  </foreignObject>

  <!-- Languages geometry -->
  <rect class="card"
        x="390.5" y="0.5"
        width="369" height="189"
        rx="6" />

  <rect class="bar-background"
        x="410" y="58"
        width="330" height="10"
        rx="5" />

  <g clip-path="url(#language-bar-clip)">
        <rect x="410.00" y="58" width="146.50" height="10" fill="#f34b7d" />
        <rect x="556.50" y="58" width="67.50" height="10" fill="#f1e05a" />
        <rect x="624.00" y="58" width="36.14" height="10" fill="#012456" />
        <rect x="660.14" y="58" width="32.68" height="10" fill="#663399" />
        <rect x="692.82" y="58" width="26.74" height="10" fill="#3572a5" />
  </g>

  <foreignObject x="410" y="8" width="330" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml"
         class="html-text title-text">Languages</div>
  </foreignObject>

  <!-- Language dots stay SVG -->
  <circle cx="416" cy="84" r="4" fill="#f34b7d" />
  <circle cx="416" cy="106" r="4" fill="#f1e05a" />
  <circle cx="416" cy="128" r="4" fill="#012456" />
  <circle cx="416" cy="150" r="4" fill="#663399" />
  <circle cx="416" cy="172" r="4" fill="#3572a5" />

  <!-- Language names and percentages are XHTML -->

    <foreignObject x="428" y="73" width="230" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="primary html-text html-row">C++</div>
    </foreignObject>

    <foreignObject x="660" y="73" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="secondary html-text html-row html-right">44.4%</div>
    </foreignObject>

    <foreignObject x="428" y="95" width="230" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="primary html-text html-row">JavaScript</div>
    </foreignObject>

    <foreignObject x="660" y="95" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="secondary html-text html-row html-right">20.5%</div>
    </foreignObject>

    <foreignObject x="428" y="117" width="230" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="primary html-text html-row">PowerShell</div>
    </foreignObject>

    <foreignObject x="660" y="117" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="secondary html-text html-row html-right">11.0%</div>
    </foreignObject>

    <foreignObject x="428" y="139" width="230" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="primary html-text html-row">CSS</div>
    </foreignObject>

    <foreignObject x="660" y="139" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="secondary html-text html-row html-right">9.9%</div>
    </foreignObject>

    <foreignObject x="428" y="161" width="230" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="primary html-text html-row">Python</div>
    </foreignObject>

    <foreignObject x="660" y="161" width="80" height="22">
      <div xmlns="http://www.w3.org/1999/xhtml"
           class="secondary html-text html-row html-right">8.1%</div>
    </foreignObject>

</svg>

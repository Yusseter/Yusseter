<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="146.10" height="10" fill="#012456" />
        <rect x="146.10" y="0" width="86.12" height="10" fill="#f34b7d" />
        <rect x="232.22" y="0" width="44.79" height="10" fill="#f1e05a" />
        <rect x="277.01" y="0" width="21.68" height="10" fill="#663399" />
        <rect x="298.69" y="0" width="17.74" height="10" fill="#3572a5" />
    </g>
</svg>

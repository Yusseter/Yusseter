<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="165.98" height="10" fill="#012456" />
        <rect x="165.98" y="0" width="87.65" height="10" fill="#f34b7d" />
        <rect x="253.63" y="0" width="34.98" height="10" fill="#f1e05a" />
        <rect x="288.61" y="0" width="16.94" height="10" fill="#663399" />
        <rect x="305.55" y="0" width="13.86" height="10" fill="#3572a5" />
    </g>
</svg>

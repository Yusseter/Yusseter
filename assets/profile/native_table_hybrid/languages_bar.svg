<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="113.80" height="10" fill="#012456" />
        <rect x="113.80" y="0" width="55.23" height="10" fill="#b07219" />
        <rect x="169.03" y="0" width="40.84" height="10" fill="#3572a5" />
        <rect x="209.87" y="0" width="27.85" height="10" fill="#f34b7d" />
        <rect x="237.72" y="0" width="26.49" height="10" fill="#f1e05a" />
    </g>
</svg>

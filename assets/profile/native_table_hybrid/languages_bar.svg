<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="162.17" height="10" fill="#012456" />
        <rect x="162.17" y="0" width="82.15" height="10" fill="#f34b7d" />
        <rect x="244.32" y="0" width="39.25" height="10" fill="#f1e05a" />
        <rect x="283.57" y="0" width="19.00" height="10" fill="#663399" />
        <rect x="302.57" y="0" width="15.55" height="10" fill="#3572a5" />
    </g>
</svg>

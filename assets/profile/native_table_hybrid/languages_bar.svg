<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="161.39" height="10" fill="#012456" />
        <rect x="161.39" y="0" width="94.35" height="10" fill="#f34b7d" />
        <rect x="255.74" y="0" width="34.02" height="10" fill="#f1e05a" />
        <rect x="289.76" y="0" width="16.47" height="10" fill="#663399" />
        <rect x="306.22" y="0" width="13.48" height="10" fill="#3572a5" />
    </g>
</svg>

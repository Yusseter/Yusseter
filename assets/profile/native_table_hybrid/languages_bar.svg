<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="111.23" height="10" fill="#012456" />
        <rect x="111.23" y="0" width="109.07" height="10" fill="#f34b7d" />
        <rect x="220.30" y="0" width="50.25" height="10" fill="#f1e05a" />
        <rect x="270.55" y="0" width="24.33" height="10" fill="#663399" />
        <rect x="294.87" y="0" width="19.91" height="10" fill="#3572a5" />
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="330" height="10" viewBox="0 0 330 10" role="img" aria-label="Language distribution">
    <style>
        .track {
            fill: #59636e;
            fill-opacity: 0.12;
        }

        @media (prefers-color-scheme: dark) {
            .track {
                fill: #9198a1;
                fill-opacity: 0.18;
            }
        }
    </style>

    <defs>
        <clipPath id="bar-clip">
            <rect x="0" y="0" width="330" height="10" rx="5" />
        </clipPath>
    </defs>

    <rect class="track" x="0" y="0" width="330" height="10" rx="5" />

    <g clip-path="url(#bar-clip)">
        <rect x="0.00" y="0" width="170.33" height="10" fill="#012456" />
        <rect x="170.33" y="0" width="81.30" height="10" fill="#f34b7d" />
        <rect x="251.63" y="0" width="35.90" height="10" fill="#f1e05a" />
        <rect x="287.53" y="0" width="17.38" height="10" fill="#663399" />
        <rect x="304.91" y="0" width="14.22" height="10" fill="#3572a5" />
    </g>
</svg>
